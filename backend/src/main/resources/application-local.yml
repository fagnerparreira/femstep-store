spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/femstep_store
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        
  flyway:
    enabled: true
    locations: classpath:db/migration
    
security:
  cookies:
    secure: false
  cors:
    allowed-origins: "http://localhost:4200,http://localhost:3000"
  jwt:
    secret: local-dev-only-secret-key-with-32-bytes-minimum
    expiration: 900000

payments:
  sandbox-enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.femstep.store: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
