<article class="product-card">
  <a class="product-image" [routerLink]="['/product', product.slug]">
    <img
      [src]="product.imageUrl || '/assets/images/product-placeholder.svg'"
      [alt]="product.imageAlt || product.name"
      loading="lazy"
      (error)="onImageError($event)"
    >

    <div class="product-badges">
      <span class="badge badge-new" *ngIf="product.isNew">Novo</span>
      <span class="badge badge-sale" *ngIf="product.onSale">Oferta</span>
    </div>

    <span class="view-product" *ngIf="showQuickActions">Ver produto</span>
  </a>

  <div class="product-info">
    <a class="product-category" [routerLink]="['/catalog']" [queryParams]="{ category: product.categorySlug }">
      {{ product.category }}
    </a>
    <h3 class="product-name">
      <a [routerLink]="['/product', product.slug]">{{ product.name }}</a>
    </h3>

    <div class="product-price">
      <span class="original-price" *ngIf="product.originalPrice && product.originalPrice > product.price">
        {{ product.originalPrice | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}
      </span>
      <span class="current-price">{{ product.price | currency:'BRL':'symbol':'1.2-2':'pt-BR' }}</span>
      <span class="installments">ou 6x de {{ product.price / 6 | currency:'BRL':'symbol':'1.2-2':'pt-BR' }} sem juros</span>
    </div>

    <div class="product-sizes" *ngIf="product.availableSizes.length">
      <span *ngFor="let size of product.availableSizes.slice(0, 8)">{{ size }}</span>
    </div>
  </div>
</article>
