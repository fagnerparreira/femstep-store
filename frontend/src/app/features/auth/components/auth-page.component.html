<main class="auth-page">
  <div class="auth-visual" aria-hidden="true">
    <img src="/assets/images/products/scarpin-celeste.png" alt="">
    <div>
      <span>FemStep</span>
      <strong>Um novo passo começa aqui.</strong>
    </div>
  </div>

  <section class="auth-content">
    <div class="auth-card">
      <a routerLink="/" class="back-link">← Voltar para a loja</a>
      <span class="eyebrow">{{ eyebrow }}</span>
      <h1>{{ title }}</h1>
      <p>{{ intro }}</p>

      <form *ngIf="mode !== 'verify'" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="name-grid" *ngIf="mode === 'register'">
          <label>
            <span>Nome</span>
            <input formControlName="firstName" autocomplete="given-name">
            <small *ngIf="fieldInvalid('firstName')">Informe seu nome.</small>
          </label>
          <label>
            <span>Sobrenome</span>
            <input formControlName="lastName" autocomplete="family-name">
            <small *ngIf="fieldInvalid('lastName')">Informe seu sobrenome.</small>
          </label>
        </div>

        <label *ngIf="mode === 'login' || mode === 'register' || mode === 'forgot'">
          <span>E-mail</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="voce@exemplo.com">
          <small *ngIf="fieldInvalid('email')">Digite um e-mail válido.</small>
        </label>

        <label *ngIf="mode === 'register'">
          <span>CPF <em>opcional</em></span>
          <input formControlName="cpf" inputmode="numeric" maxlength="11" autocomplete="off" placeholder="Somente números">
          <small *ngIf="fieldInvalid('cpf')">O CPF deve conter 11 números.</small>
        </label>

        <label *ngIf="mode === 'login' || mode === 'register' || mode === 'reset'">
          <span>Senha</span>
          <input type="password" formControlName="password" [autocomplete]="mode === 'login' ? 'current-password' : 'new-password'" placeholder="Mínimo de 12 caracteres">
          <small *ngIf="fieldInvalid('password')">Use uma senha com pelo menos 12 caracteres.</small>
        </label>

        <label *ngIf="mode === 'reset'">
          <span>Confirme a nova senha</span>
          <input type="password" formControlName="confirmPassword" autocomplete="new-password">
          <small *ngIf="fieldInvalid('confirmPassword')">Repita a nova senha.</small>
        </label>

        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
        <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>

        <button type="submit" [disabled]="isSubmitting || (mode === 'reset' && !token)">
          {{ isSubmitting ? 'Aguarde...' : submitLabel }}
        </button>
      </form>

      <p class="error-message" *ngIf="mode === 'verify' && errorMessage">{{ errorMessage }}</p>
      <p class="success-message" *ngIf="mode === 'verify' && successMessage">{{ successMessage }}</p>
      <p class="switch-mode" *ngIf="mode === 'verify' || (mode === 'reset' && successMessage)">
        <a routerLink="/auth/login">Ir para o login</a>
      </p>
      <p class="switch-mode" *ngIf="mode === 'login'">
        <a routerLink="/auth/forgot-password">Esqueci minha senha</a>
      </p>
      <p class="switch-mode" *ngIf="mode === 'login'">
        Ainda não tem conta? <a routerLink="/auth/register">Cadastre-se</a>
      </p>
      <p class="switch-mode" *ngIf="mode === 'register'">
        Já tem uma conta? <a routerLink="/auth/login">Entrar</a>
      </p>
      <p class="switch-mode" *ngIf="mode === 'forgot' || mode === 'reset'">
        <a routerLink="/auth/login">Voltar ao login</a>
      </p>
    </div>
  </section>
</main>
